# =============================================================================
# CI — the guards that catch what actually broke this repo.
# =============================================================================
# Runs on push and pull request, not workflow_dispatch alone: a workflow that
# only runs when somebody clicks it reports the last click rather than the
# state of main, and a commit that breaks the build leaves it looking fine.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  script-perms:
    name: Script Permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every script with a shebang must be executable
        run: |
          # core.filemode is false on the Windows machine these are authored on,
          # so `chmod +x` is never recorded and every .sh here landed 100644.
          # The README and INSTALL both show the scripts being run directly, and
          # those fail with "Permission denied" on Linux and macOS while working
          # fine for the author, because MSYS ignores the bit. It is invisible
          # where it is introduced and fatal everywhere else, which is exactly
          # the kind of bug that comes back.
          bad=0
          while read -r mode _ _ path; do
            case "$mode" in 100755) continue ;; esac
            if head -1 "$path" 2>/dev/null | grep -q '^#!'; then
              echo "::error file=$path::has a shebang but is mode $mode - run: git update-index --chmod=+x $path"
              bad=1
            fi
          done < <(git ls-files -s '*.sh')
          [ "$bad" = 0 ] && echo "All shebang scripts are executable."
          exit "$bad"

  # ---------------------------------------------------------------------------
  no-submodules:
    name: No Submodules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: citra-common must stay vendored, not a submodule
        run: |
          # citra-common WAS a submodule, and GitHub's source archives cannot
          # carry submodule content -- so the v0.1.0 release downloaded as an
          # empty citra-common/ and could not build, while the repository it was
          # cut from built fine. Nothing about a normal test run would notice it
          # coming back, so the guard is the check.
          if [ -f .gitmodules ]; then
            echo "::error file=.gitmodules::a submodule was reintroduced; source archives cannot carry it"
            cat .gitmodules
            exit 1
          fi
          if git ls-files -s | awk '$1 == "160000" { print; found = 1 } END { exit !found }'; then
            echo "::error::a gitlink (mode 160000) is tracked - that is a submodule by another name"
            exit 1
          fi
          n=$(git ls-files citra-common | wc -l)
          if [ "$n" -lt 100 ]; then
            echo "::error::citra-common has only $n tracked files; the Dockerfiles copy from it"
            exit 1
          fi
          echo "citra-common is vendored: $n tracked files, no gitlinks."

  # ---------------------------------------------------------------------------
  # Same matrix the release gate uses. Contexts come from
  # docker-compose.quickstart.yml, which is what the wizard actually runs.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      # One failing image must not cancel the rest: fail-fast hides their real
      # state behind "cancelled", which costs an extra round trip per image.
      fail-fast: false
      matrix:
        include:
          - image: citra-workflow
            dockerfile: citra-workflow/Dockerfile
            context: .
          - image: citra-worker
            dockerfile: Citra-Worker/Dockerfile
            context: .
          - image: citra-user-service
            dockerfile: citra-common/Citra-User-Service/Dockerfile
            context: citra-common/Citra-User-Service
          - image: citra-flows-ui
            dockerfile: ui/Dockerfile
            context: ui
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: citra-flows-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
