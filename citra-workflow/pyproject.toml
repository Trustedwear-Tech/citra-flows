[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citra-workflow"
version = "1.1.0"
description = "Citra workflow engine — visual agent workflow builder. Runs as its own FastAPI service (own port, own container). Citra-Service no longer imports it; smart-app-service talks to it over HTTP; Citra-Worker imports just the executor + node implementations for out-of-process workflow runs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "python-multipart>=0.0.20,<1.0",
  "pydantic>=2.5",
  "motor>=3.3",
  "cryptography>=41.0",
  "httpx>=0.25,<1.0",
  "uvicorn[standard]>=0.27",
  # Shared platform libs — no in-tree copies, no PYTHONPATH hacks.
  "citra-queue>=1.0.0",
  "citra-auth>=1.0.0",
  "citra-mongo>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["citra_workflow*"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require live services (Mongo, Redis, Citra-Service sandbox); excluded from the unit-test run",
    "asyncio: marks tests as asyncio coroutines (pytest-asyncio)",
]
asyncio_mode = "auto"
